name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona el repositorio en el runner de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configura el JDK 
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Dar permisos de ejecucion al wrapper si existe
      - name: Asignar permisos al wrapper de Maven (opcional si usa mvnw)
        run: chmod +x ./mvnw || true

      # 4. Compilar y ejecutar pruebas unitarias
      - name: Compilar y ejecutar tests con Maven
        run: ./mvnw clean verify || mvn clean verify